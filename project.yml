name: PropertyRecords
options:
  bundleIdPrefix: com.p4suta
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
  knownRegions: [ja, en, Base]
packages:
  PropertyRecordsCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    COMPILATION_CACHE_ENABLE_CACHING: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  PropertyRecords:
    build:
      targets:
        PropertyRecords: all
    test:
      targets: [PropertyRecordsAppTests, PropertyRecordsUITests]
      gatherCoverageData: true
      preActions:
        - name: Prepare the simulator photo fixture
          settingsTarget: PropertyRecords
          script: |
            set -eu
            if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
              xcrun simctl bootstatus "$TARGET_DEVICE_IDENTIFIER" -b
              xcrun simctl addmedia "$TARGET_DEVICE_IDENTIFIER" "$SRCROOT/UITests/Fixtures/Building.png"
            fi
  PropertyRecordsReview:
    build:
      targets:
        PropertyRecords: [test]
    test:
      config: Release
      targets:
        - name: PropertyRecordsUITests
          parallelizable: false
      gatherCoverageData: false
      preferredScreenCaptureFormat: screenRecording
      deleteScreenshotsWhenEachTestSucceeds: false
targets:
  PropertyRecords:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: PropertyRecordsCore
        product: PropertyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.PropertyRecords
        DEVELOPMENT_TEAM: XMBQLW82L9
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: App/DevelopmentAssets
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 4
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 物件管理くん
        INFOPLIST_KEY_NSCameraUsageDescription: 修繕箇所を撮影して、対応の記録に写真を追加します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  PropertyRecordsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: PropertyRecords
      - package: PropertyRecordsCore
        product: PropertyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.PropertyRecordsAppTests
  PropertyRecordsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PropertyRecords
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.p4suta.PropertyRecordsUITests
        VOICEOVER_TEST_CONDITION: VOICEOVER_AUTOMATION
        "VOICEOVER_TEST_CONDITION[sdk=iphoneos26.*]": ""
        "VOICEOVER_TEST_CONDITION[sdk=iphonesimulator26.*]": ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(VOICEOVER_TEST_CONDITION)"
